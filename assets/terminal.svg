<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 215" width="100%" height="215">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      
      text {
        font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
        user-select: none;
      }
      
      /* Slide Transitions: 21s total cycle (7s per slide) */
      @keyframes s1 {
        0%, 28% { opacity: 1; visibility: visible; }
        33.3%, 94.7% { opacity: 0; visibility: hidden; }
        100% { opacity: 1; visibility: visible; }
      }
      @keyframes s2 {
        0%, 28.6% { opacity: 0; visibility: hidden; }
        33.3%, 61.9% { opacity: 1; visibility: visible; }
        66.6%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes s3 {
        0%, 61.9% { opacity: 0; visibility: hidden; }
        66.6%, 95.2% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
      }
      
      .slide-1 { animation: s1 21s ease-in-out infinite; }
      .slide-2 { animation: s2 21s ease-in-out infinite; }
      .slide-3 { animation: s3 21s ease-in-out infinite; }
      
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: blink 1s infinite; fill: #58a6ff; }
      
      /* GitHub-Dark Refined Syntax Highlighting */
      .p       { fill: #58a6ff; font-weight: 600; font-size: 13px; }
      .cmd     { fill: #f0f6fc; font-size: 13px; font-weight: 500; }
      .k       { fill: #8b949e; font-size: 12px; }
      .v       { fill: #f0f6fc; font-size: 12px; }
      .vd      { fill: #c9d1d9; font-size: 12px; }
      .dir     { fill: #79c0ff; font-size: 12px; font-weight: 600; }
      .m       { fill: #6e7681; font-size: 11px; }
      
      /* Starship / Tmux Statusline */
      .st-text { font-size: 10px; fill: #8b949e; }
      .st-git  { font-size: 10px; fill: #3fb950; font-weight: 600; }
      .st-ok   { font-size: 10px; fill: #3fb950; font-weight: 600; }
      .st-sep  { font-size: 10px; fill: #30363d; }
    </style>
  </defs>

  <!-- Terminal Window Card -->
  <rect width="800" height="215" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1.2"/>

  <!-- Window Title Bar -->
  <rect width="800" height="30" rx="8" fill="#141417"/>
  <rect y="22" width="800" height="8" fill="#141417"/>
  <line x1="0" y1="30" x2="800" y2="30" stroke="#27272a" stroke-width="1"/>

  <!-- macOS Traffic Light Dots (Classy Pastel) -->
  <circle cx="20" cy="15" r="4.5" fill="#ff5f57"/>
  <circle cx="36" cy="15" r="4.5" fill="#febc2e"/>
  <circle cx="52" cy="15" r="4.5" fill="#28c840"/>

  <!-- Window Header Title -->
  <text x="400" y="19" fill="#8b949e" font-size="11" text-anchor="middle" letter-spacing="1">IrRick@workstation:~</text>

  <!-- Slide Counter (Top Right) -->
  <g class="slide-1"><text x="780" y="19" fill="#6e7681" font-size="11" text-anchor="end">[ 1 / 3 ]</text></g>
  <g class="slide-2"><text x="780" y="19" fill="#6e7681" font-size="11" text-anchor="end">[ 2 / 3 ]</text></g>
  <g class="slide-3"><text x="780" y="19" fill="#6e7681" font-size="11" text-anchor="end">[ 3 / 3 ]</text></g>

  <!-- ════════ SLIDE 1: WHOAMI ════════ -->
  <g class="slide-1">
    <text y="60">
      <tspan x="24" class="p">IrRick@workstation:~$</tspan>
      <tspan class="cmd"> whoami</tspan>
      <tspan class="cursor">_</tspan>
    </text>
    
    <text y="88">
      <tspan x="24" class="k">name</tspan>
      <tspan x="110" class="v">Pham Nguyen Trong Tri</tspan>
      <tspan class="m"> (Rick)</tspan>
    </text>
    
    <text y="112">
      <tspan x="24" class="k">role</tspan>
      <tspan x="110" class="v">Backend Developer</tspan>
      <tspan class="m"> · </tspan>
      <tspan class="vd">Scalable Systems</tspan>
    </text>
    
    <text y="136">
      <tspan x="24" class="k">focus</tspan>
      <tspan x="110" class="vd">High-Throughput APIs · Async Queues · Database Optimization</tspan>
    </text>
    
    <text y="160">
      <tspan x="24" class="k">motto</tspan>
      <tspan x="110" class="v">"Each bug, a lesson. Each fix, an evolution."</tspan>
    </text>
  </g>

  <!-- ════════ SLIDE 2: PROJECTS ════════ -->
  <g class="slide-2">
    <text y="60">
      <tspan x="24" class="p">IrRick@workstation:~$</tspan>
      <tspan class="cmd"> ls -la ./projects/</tspan>
      <tspan class="cursor">_</tspan>
    </text>
    
    <text y="90">
      <tspan x="24" class="m">drwxr-xr-x</tspan>
      <tspan x="110" class="dir">one-mekong/</tspan>
      <tspan x="235" class="vd">NestJS · TypeScript · Redis · BullMQ · MongoDB</tspan>
    </text>
    <text y="110">
      <tspan x="235" class="m">↳ Multi-service platform serving hospitality &amp; cruise management</tspan>
    </text>
    
    <text y="138">
      <tspan x="24" class="m">drwxr-xr-x</tspan>
      <tspan x="110" class="dir">spider-news/</tspan>
      <tspan x="235" class="vd">Python · FastAPI · Playwright · APScheduler</tspan>
    </text>
    <text y="158">
      <tspan x="235" class="m">↳ Automated news crawler &amp; data extraction pipeline</tspan>
    </text>
  </g>

  <!-- ════════ SLIDE 3: TECH STACK ════════ -->
  <g class="slide-3">
    <text y="60">
      <tspan x="24" class="p">IrRick@workstation:~$</tspan>
      <tspan class="cmd"> cat stack.txt</tspan>
      <tspan class="cursor">_</tspan>
    </text>
    
    <text y="88">
      <tspan x="24" class="k">backend</tspan>
      <tspan x="110" class="v">NestJS · Spring Boot · FastAPI · TypeScript · Python · Java</tspan>
    </text>
    
    <text y="112">
      <tspan x="24" class="k">database</tspan>
      <tspan x="110" class="v">Redis · BullMQ · MongoDB · MySQL · PostgreSQL</tspan>
    </text>
    
    <text y="136">
      <tspan x="24" class="k">devops</tspan>
      <tspan x="110" class="v">Docker · Git · Playwright · RESTful APIs</tspan>
    </text>
    
    <text y="160">
      <tspan x="24" class="k">focus</tspan>
      <tspan x="110" class="vd">Clean Architecture · Async Processing · Index Tuning</tspan>
    </text>
  </g>

  <!-- ════════ STARSHIP / TMUX STATUSLINE ════════ -->
  <path d="M 0 188 L 800 188 L 800 207 A 8 8 0 0 1 792 215 L 8 215 A 8 8 0 0 1 0 207 Z" fill="#141417"/>
  <line x1="0" y1="188" x2="800" y2="188" stroke="#27272a" stroke-width="1"/>

  <!-- Left: Shell & Git Status -->
  <circle cx="20" cy="202" r="3" fill="#3fb950"/>
  <text x="32" y="205">
    <tspan class="st-text">zsh 5.9</tspan>
    <tspan class="st-sep">  │  </tspan>
    <tspan class="st-text">git:(</tspan><tspan class="st-git">master</tspan><tspan class="st-text">)</tspan>
    <tspan class="st-sep">  │  </tspan>
    <tspan class="st-text">utf-8</tspan>
  </text>

  <!-- Right: Telemetry & Status -->
  <text x="780" y="205" text-anchor="end">
    <tspan class="st-ok">200 OK</tspan>
    <tspan class="st-sep">  │  </tspan>
    <tspan class="st-text">latency: 0.8ms</tspan>
    <tspan class="st-sep">  │  </tspan>
    <tspan class="st-text">cycle: 7s</tspan>
  </text>
</svg>
