<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" width="100%" height="190">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      
      text {
        font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
        user-select: none;
      }
      
      /* Slide Transitions: 21s total (7s per slide) */
      @keyframes s1 {
        0%, 28% { opacity: 1; visibility: visible; }
        33.3%, 94.7% { opacity: 0; visibility: hidden; }
        100% { opacity: 1; visibility: visible; }
      }
      @keyframes s2 {
        0%, 28.6% { opacity: 0; visibility: hidden; }
        33.3%, 61.9% { opacity: 1; visibility: visible; }
        66.6%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes s3 {
        0%, 61.9% { opacity: 0; visibility: hidden; }
        66.6%, 95.2% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
      }
      
      .slide-1 { animation: s1 21s ease-in-out infinite; }
      .slide-2 { animation: s2 21s ease-in-out infinite; }
      .slide-3 { animation: s3 21s ease-in-out infinite; }
      
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: blink 1s infinite; }
      
      /* Monochrome Typography */
      .prompt  { fill: #ffffff; font-weight: 600; font-size: 13px; }
      .cmd     { fill: #e4e4e7; font-size: 13px; }
      .key     { fill: #71717a; font-size: 12px; }
      .val     { fill: #f4f4f5; font-size: 12px; }
      .val-dim { fill: #a1a1aa; font-size: 12px; }
      .meta    { fill: #52525b; font-size: 11px; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="800" height="190" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1.2"/>

  <!-- Title Bar -->
  <rect width="800" height="30" rx="8" fill="#141417"/>
  <rect y="22" width="800" height="8" fill="#141417"/>
  <line x1="0" y1="30" x2="800" y2="30" stroke="#27272a" stroke-width="1"/>

  <!-- Minimal Grayscale Dots -->
  <circle cx="18" cy="15" r="4" fill="#3f3f46"/>
  <circle cx="32" cy="15" r="4" fill="#27272a"/>
  <circle cx="46" cy="15" r="4" fill="#27272a"/>

  <!-- Window Header -->
  <text x="400" y="19" class="meta" text-anchor="middle" letter-spacing="1">irrick@workstation:~</text>

  <!-- Slide Indicators -->
  <g class="slide-1"><text x="782" y="19" class="meta" text-anchor="end">[ 1 / 3 ]</text></g>
  <g class="slide-2"><text x="782" y="19" class="meta" text-anchor="end">[ 2 / 3 ]</text></g>
  <g class="slide-3"><text x="782" y="19" class="meta" text-anchor="end">[ 3 / 3 ]</text></g>

  <!-- ════════ SLIDE 1: WHOAMI ════════ -->
  <g class="slide-1">
    <text y="62">
      <tspan x="24" class="prompt">irrick@workstation:~$</tspan>
      <tspan class="cmd"> whoami</tspan>
      <tspan class="cursor" fill="#ffffff">_</tspan>
    </text>
    
    <text y="92">
      <tspan x="24" class="key">name</tspan>
      <tspan x="110" class="val">Pham Nguyen Trong Tri</tspan>
      <tspan class="meta"> (Rick)</tspan>
    </text>
    
    <text y="118">
      <tspan x="24" class="key">role</tspan>
      <tspan x="110" class="val">Backend Developer · Scalable Systems</tspan>
    </text>
    
    <text y="144">
      <tspan x="24" class="key">focus</tspan>
      <tspan x="110" class="val-dim">High-Throughput APIs · Async Queues · Database Optimization</tspan>
    </text>
    
    <text y="170">
      <tspan x="24" class="key">motto</tspan>
      <tspan x="110" class="val">"Each bug, a lesson. Each fix, an evolution."</tspan>
    </text>
  </g>

  <!-- ════════ SLIDE 2: PROJECTS ════════ -->
  <g class="slide-2">
    <text y="62">
      <tspan x="24" class="prompt">irrick@workstation:~$</tspan>
      <tspan class="cmd"> ls -la ./projects/</tspan>
      <tspan class="cursor" fill="#ffffff">_</tspan>
    </text>
    
    <text y="94">
      <tspan x="24" class="key">drwxr-xr-x</tspan>
      <tspan x="110" class="val" font-weight="600">one-mekong/</tspan>
      <tspan x="245" class="val-dim">NestJS · TypeScript · Redis · BullMQ · MongoDB</tspan>
    </text>
    <text y="116">
      <tspan x="245" class="meta">↳ Hospitality &amp; cruise management multi-service platform</tspan>
    </text>
    
    <text y="146">
      <tspan x="24" class="key">drwxr-xr-x</tspan>
      <tspan x="110" class="val" font-weight="600">spider-news/</tspan>
      <tspan x="245" class="val-dim">Python · FastAPI · Playwright · APScheduler</tspan>
    </text>
    <text y="168">
      <tspan x="245" class="meta">↳ Automated news crawler &amp; data pipeline</tspan>
    </text>
  </g>

  <!-- ════════ SLIDE 3: TECH STACK ════════ -->
  <g class="slide-3">
    <text y="62">
      <tspan x="24" class="prompt">irrick@workstation:~$</tspan>
      <tspan class="cmd"> cat stack.txt</tspan>
      <tspan class="cursor" fill="#ffffff">_</tspan>
    </text>
    
    <text y="92">
      <tspan x="24" class="key">backend</tspan>
      <tspan x="110" class="val">NestJS · Spring Boot · FastAPI · TypeScript · Python · Java</tspan>
    </text>
    
    <text y="118">
      <tspan x="24" class="key">database</tspan>
      <tspan x="110" class="val">Redis · BullMQ · MongoDB · MySQL · PostgreSQL</tspan>
    </text>
    
    <text y="144">
      <tspan x="24" class="key">devops</tspan>
      <tspan x="110" class="val">Docker · Git · Playwright · RESTful APIs</tspan>
    </text>
    
    <text y="170">
      <tspan x="24" class="key">focus</tspan>
      <tspan x="110" class="val-dim">Clean Architecture · Async Processing · Index Tuning</tspan>
    </text>
  </g>
</svg>
